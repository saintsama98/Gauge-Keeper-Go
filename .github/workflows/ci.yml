name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: install go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"

      - name: versions
        run: go version

      - name: format check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: vet
        run: go vet ./... && go vet -tags integration ./internal/integration/

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...
